apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ include "payment-web.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "payment-web.selectorLabels" . | nindent 4 }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-{{ include "payment-web.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-web.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "payment-web.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
